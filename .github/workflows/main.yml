name: Continuous Integration - Operacao

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissão global para não ter erro
permissions:
  issues: write
  contents: read

jobs:
  testes_e_alerta:
    name: Run Tests and Alert
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Executar Testes Unitarios
      run: python -m unittest test_missao.py

    - name: Criar Alerta de Falha
      if: failure() # Roda imediatamente se o passo de cima quebrar
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh issue create --title "🚨 ALERTA: Falha na Missão CI/CD" --body "Atenção Ghost, os testes unitários falharam. O código não foi aprovado."
